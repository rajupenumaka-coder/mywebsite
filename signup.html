<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - My Website</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="login-box">

    <h1>🚀 Create Your Account</h1>

    <p>Join My Website today!</p>


    <form onsubmit="signupUser(event)">


        <!-- FULL NAME -->
        <input
            type="text"
            id="signupName"
            placeholder="👤 Full Name"
            required
        >


        <!-- EMAIL -->
        <input
            type="email"
            id="signupEmail"
            placeholder="📧 Email Address"
            required
        >


        <!-- MOBILE -->
        <input
            type="tel"
            id="signupMobile"
            placeholder="📱 Mobile Number"
            pattern="[0-9]{10}"
            maxlength="10"
            required
        >


        <!-- DATE OF BIRTH -->
        <label for="signupDOB">
            🎂 Date of Birth
        </label>

        <input
            type="date"
            id="signupDOB"
            required
        >


        <!-- GENDER -->
        <select id="signupGender" required>

            <option value="">
                ⚧ Select Gender
            </option>

            <option value="Male">
                Male
            </option>

            <option value="Female">
                Female
            </option>

            <option value="Other">
                Other
            </option>

            <option value="Prefer not to say">
                Prefer not to say
            </option>

        </select>


        <!-- COUNTRY -->
        <select id="signupCountry" required>

            <option value="">
                🌍 Select Country
            </option>

            <option value="India">
                India
            </option>

            <option value="United States">
                United States
            </option>

            <option value="United Kingdom">
                United Kingdom
            </option>

            <option value="Canada">
                Canada
            </option>

            <option value="Australia">
                Australia
            </option>

            <option value="Other">
                Other
            </option>

        </select>


        <!-- CITY -->
        <input
            type="text"
            id="signupCity"
            placeholder="📍 City"
            required
        >


        <!-- PASSWORD -->
        <div class="password-box">

            <input
                type="password"
                id="signupPassword"
                placeholder="🔐 Password"
                minlength="6"
                required
            >

            <button
                type="button"
                onclick="togglePassword('signupPassword', this)"
            >
                👁️
            </button>

        </div>


        <!-- CONFIRM PASSWORD -->
        <div class="password-box">

            <input
                type="password"
                id="confirmPassword"
                placeholder="🔐 Confirm Password"
                minlength="6"
                required
            >

            <button
                type="button"
                onclick="togglePassword('confirmPassword', this)"
            >
                👁️
            </button>

        </div>


        <!-- TERMS -->
        <div class="terms-box">

            <label>

                <input
                    type="checkbox"
                    id="terms"
                    required
                >

                I agree to the
                <a href="#" onclick="showTerms(event)">
                    Terms & Conditions
                </a>

            </label>

        </div>


        <!-- SIGN UP -->
        <button type="submit">
            🚀 Create Account
        </button>

    </form>


    <!-- LOGIN -->
    <p>
        Already have an account?
    </p>

    <button
        onclick="window.location.href='login.html'"
    >
        🔑 Login
    </button>


    <br>
    <br>


    <!-- HOME -->
    <a href="index.html">
        ← Back to Home
    </a>

</div>


<script src="script.js"></script>


<script>

function showTerms(event) {

    event.preventDefault();

    alert(
        "Terms & Conditions\n\n" +
        "1. Please provide correct information.\n" +
        "2. Keep your account details secure.\n" +
        "3. Do not share your password with others.\n" +
        "4. Use this website responsibly."
    );

}

</script>

</body>
</html>
