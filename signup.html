<!DOCTYPE html>
<html>
<head>
    <title>Sign Up - My Website</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="login-box">

    <h1>Create Account</h1>
     
    <form onsubmit="signupUser(event)">

    <input type="text" id="signupName" placeholder="Full Name" required>

    <input type="email" placeholder="Email" required>

    <div class="password-box">
        <input type="password" id="signupPassword" placeholder="Password" required>
        <button type="button" onclick="togglePassword('signupPassword', this)">👁️</button>
    </div>

    <div class="password-box">
        <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
        <button type="button" onclick="togglePassword('confirmPassword', this)">👁️</button>
    </div>

    <button type="submit">Sign Up</button>

</form>
    <p>Already have an account?</p>

    <button onclick="window.location.href='login.html'">
        Login
    </button>

    <br><br>

    <a href="index.html">← Back to Home</a>

</div>

<script src="script.js"></script>

</body>
</html>
