<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Forgot Password - My Website</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="login-box">

    <h1>Forgot Password 🔐</h1>

    <p>
        Enter the email address associated
        with your account.
    </p>

    <form onsubmit="forgotPassword(event)">

        <input
            type="email"
            id="forgotEmail"
            placeholder="Enter your email"
            required
        >

        <button type="submit">
            Continue
        </button>

    </form>

    <br>

    <a href="login.html">
        ← Back to Login
    </a>

</div>


<script src="script.js"></script>

</body>

</html>
