<!DOCTYPE html>
<html>
<head>
    <title>Dashboard - My Website</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h2>My Website</h2>

    <nav>
        <a href="index.html">Home</a>
        <a href="index.html#about">About</a>
        <a href="index.html#contact">Contact</a>
    </nav>

    <button onclick="logoutUser()">Logout</button>
</header>

<section class="dashboard">

    <h1>Welcome to Your Dashboard! 🎉</h1>
    <div class="clock-box">
    <h2 id="currentTime">00:00:00</h2>
    <p id="currentDate">Loading date...</p>
</div>

    <p>You are successfully logged in.</p>

    <div class="dashboard-card">
    <h2>👤 Profile</h2>
    <p><strong>Name:</strong> Your Name</p>
    <p><strong>Email:</strong> your@email.com</p>
    <button onclick="window.location.href='profile.html'">
    View Profile
    </button>
    </div>
    <div class="dashboard-card">
    <h2>📊 Statistics</h2>
    <p>View your website statistics.</p>

    <button onclick="window.location.href='statistics.html'">
        View Statistics
    </button>
    <div class="dashboard-card">
    <h2>⚙️ Settings</h2>
    <p>Manage your account settings.</p>

    <button onclick="window.location.href='settings.html'">
        Open Settings
    </button>
</div>
</div>
    </div>

</section>

<script src="script.js"></script>

</body>
</html>
