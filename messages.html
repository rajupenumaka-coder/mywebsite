<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Messages - My Website</title>

    <link rel="stylesheet" href="style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #111827;
        }

        .messages-page {
            width: 100%;
            min-height: 100vh;
        }

        /* ================= SIDEBAR ================= */

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 240px;
            height: 100vh;
            background: #111827;
            color: white;
            padding: 25px 15px;
            z-index: 1000;
        }

        .sidebar h2 {
            text-align: center;
            margin: 0 0 30px;
            font-size: 22px;
        }

        .sidebar a {
            display: block;
            color: #d1d5db;
            text-decoration: none;
            padding: 13px 15px;
            border-radius: 8px;
            margin-bottom: 8px;
        }

        .sidebar a:hover,
        .sidebar a.active {
            background: #2563eb;
            color: white;
        }

        .logout-btn {
            position: absolute;
            bottom: 25px;
            left: 15px;
            right: 15px;
            width: calc(100% - 30px);
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #dc2626;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        .logout-btn:hover {
            background: #b91c1c;
        }

        /* ================= MAIN ================= */

        .main-content {
            margin-left: 240px;
            padding: 30px;
        }

        .messages-page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .messages-title h1 {
            margin: 0 0 7px;
            font-size: 30px;
        }

        .messages-title p {
            margin: 0;
            color: #6b7280;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .header-btn {
            border: 1px solid #d1d5db;
            background: white;
            color: #374151;
            padding: 10px 15px;
            border-radius: 9px;
            cursor: pointer;
            font-size: 14px;
        }

        .header-btn:hover {
            background: #f3f4f6;
        }

        .header-btn.primary {
            background: #2563eb;
            color: white;
            border-color: #2563eb;
        }

        .header-btn.primary:hover {
            background: #1d4ed8;
        }

        /* ================= STATS ================= */

        .message-stat-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin-bottom: 25px;
        }

        .message-stat {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 15px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
        }

        .message-stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            background: #eff6ff;
        }

        .message-stat h3 {
            margin: 0 0 4px;
            font-size: 23px;
        }

        .message-stat p {
            margin: 0;
            color: #6b7280;
            font-size: 14px;
        }

        /* ================= CONTROLS ================= */

        .message-controls {
            background: white;
            padding: 18px;
            border-radius: 12px;
            border: 1px solid #e5e7eb;
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .search-box {
            flex: 1;
        }

        .search-box input,
        .filter-box select {
            width: 100%;
            padding: 11px 13px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        .search-box input:focus,
        .filter-box select:focus {
            border-color: #2563eb;
        }

        .filter-box {
            width: 180px;
        }

        /* ================= MESSAGE LIST ================= */

        .messages-container {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 15px;
            overflow: hidden;
        }

        .messages-container-header {
            padding: 18px 20px;
            border-bottom: 1px solid #e5e7eb;
        }

        .messages-container-header h2 {
            margin: 0;
            font-size: 20px;
        }

        #messagesList {
            padding: 10px;
        }

        .message-card {
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 18px;
            margin: 10px;
            transition: 0.2s;
        }

        .message-card:hover {
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.07);
        }

        .message-card.unread {
            border-left: 4px solid #2563eb;
            background: #f8fbff;
        }

        .message-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
        }

        .sender-info h3 {
            margin: 0 0 5px;
            font-size: 17px;
        }

        .sender-info p {
            margin: 0;
            color: #6b7280;
            font-size: 14px;
        }

        .message-date {
            color: #6b7280;
            font-size: 13px;
            white-space: nowrap;
        }

        .message-preview {
            margin: 15px 0;
            color: #374151;
            line-height: 1.6;
        }

        .message-actions {
            display: flex;
            gap: 8px;
        }

        .message-action-btn {
            padding: 8px 12px;
            border-radius: 7px;
            border: 1px solid #d1d5db;
            background: white;
            cursor: pointer;
        }

        .message-action-btn:hover {
            background: #f3f4f6;
        }

        .message-action-btn.delete {
            color: #dc2626;
        }

        .message-action-btn.delete:hover {
            background: #fee2e2;
        }

        .unread-badge {
            display: inline-block;
            background: #2563eb;
            color: white;
            font-size: 11px;
            padding: 3px 7px;
            border-radius: 10px;
            margin-left: 7px;
        }

        .empty-message {
            text-align: center;
            padding: 60px 20px;
            color: #6b7280;
        }

        .empty-message h3 {
            color: #374151;
        }

        /* ================= MODAL ================= */

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 20px;
        }

        .modal.show {
            display: flex;
        }

        .modal-box {
            width: 100%;
            max-width: 650px;
            background: white;
            border-radius: 15px;
            overflow: hidden;
        }

        .modal-header {
            padding: 18px 20px;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            margin: 0;
        }

        .close-btn {
            border: none;
            background: transparent;
            font-size: 25px;
            cursor: pointer;
        }

        .modal-content {
            padding: 25px;
        }

        .detail-row {
            margin-bottom: 18px;
        }

        .detail-row strong {
            display: block;
            margin-bottom: 6px;
            color: #374151;
        }

        .detail-row span,
        .detail-row div {
            color: #4b5563;
        }

        .message-full {
            background: #f9fafb;
            border-radius: 8px;
            padding: 15px;
            line-height: 1.7;
            white-space: pre-wrap;
        }

        /* ================= RESPONSIVE ================= */

        @media (max-width: 900px) {
            .sidebar {
                width: 200px;
            }

            .main-content {
                margin-left: 200px;
            }

            .message-stat-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 700px) {
            .sidebar {
                position: relative;
                width: 100%;
                height: auto;
            }

            .logout-btn {
                position: static;
                width: 100%;
                margin-top: 15px;
            }

            .main-content {
                margin-left: 0;
                padding: 20px;
            }

            .messages-page-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .message-controls {
                flex-direction: column;
            }

            .filter-box {
                width: 100%;
            }

            .message-top {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <!-- ================= SIDEBAR ================= -->

    <aside class="sidebar">

        <h2>My Website</h2>

        <a href="dashboard.html">🏠 Dashboard</a>

        <a href="profile.html">👤 My Profile</a>

        <a href="messages.html" class="active">💬 Messages</a>

        <a href="statistics.html">📊 Statistics</a>

        <a href="settings.html">⚙️ Settings</a>

        <button class="logout-btn" onclick="logoutUser()">
            Logout
        </button>

    </aside>


    <!-- ================= MAIN CONTENT ================= -->

    <main class="main-content">

        <div class="messages-page">

            <!-- HEADER -->

            <div class="messages-page-header">

                <div class="messages-title">

                    <h1>Messages</h1>

                    <p>
                        Manage and view contact messages
                    </p>

                </div>

                <div class="header-actions">

                    <button
                        class="header-btn primary"
                        onclick="loadMessages()">

                        🔄 Refresh

                    </button>

                </div>

            </div>


            <!-- ================= STATS ================= -->

            <div class="message-stat-grid">

                <div class="message-stat">

                    <div class="message-stat-icon">
                        💬
                    </div>

                    <div>

                        <h3 id="totalMessages">
                            0
                        </h3>

                        <p>
                            Total Messages
                        </p>

                    </div>

                </div>


                <div class="message-stat">

                    <div class="message-stat-icon">
                        👥
                    </div>

                    <div>

                        <h3 id="uniqueSenders">
                            0
                        </h3>

                        <p>
                            Unique Senders
                        </p>

                    </div>

                </div>


                <div class="message-stat">

                    <div class="message-stat-icon">
                        🕒
                    </div>

                    <div>

                        <h3 id="latestMessage">
                            -
                        </h3>

                        <p>
                            Latest Message
                        </p>

                    </div>

                </div>

            </div>


            <!-- ================= SEARCH ================= -->

            <div class="message-controls">

                <div class="search-box">

                    <input
                        type="text"
                        id="messageSearch"
                        placeholder="Search messages by name, email or message..."
                        oninput="filterMessages()">

                </div>


                <div class="filter-box">

                    <select
                        id="messageFilter"
                        onchange="filterMessages()">

                        <option value="all">
                            All Messages
                        </option>

                        <option value="unread">
                            Unread
                        </option>

                        <option value="read">
                            Read
                        </option>

                    </select>

                </div>

            </div>


            <!-- ================= MESSAGE LIST ================= -->

            <div class="messages-container">

                <div class="messages-container-header">

                    <h2>
                        Contact Messages
                    </h2>

                </div>


                <div id="messagesList">

                    <div class="empty-message">

                        <h3>
                            Loading messages...
                        </h3>

                        <p>
                            Please wait.
                        </p>

                    </div>

                </div>

            </div>

        </div>

    </main>


    <!-- ================= MESSAGE MODAL ================= -->

    <div
        class="modal"
        id="messageModal"
        onclick="closeModalOutside(event)">

        <div class="modal-box">

            <div class="modal-header">

                <h2>
                    Message Details
                </h2>

                <button
                    class="close-btn"
                    onclick="closeMessageModal()">

                    ×

                </button>

            </div>


            <div
                class="modal-content"
                id="modalContent">

            </div>

        </div>

    </div>


    <!-- ================= JAVASCRIPT ================= -->

    <script src="script.js"></script>

    <script>

        let allMessages = [];


        /* =========================================
           GET AUTH TOKEN
        ========================================= */

        function getMessageAuthToken() {

            return (
                localStorage.getItem("authToken") ||
                sessionStorage.getItem("authToken")
            );

        }


        /* =========================================
           CHECK LOGIN
        ========================================= */

        function checkMessagesLogin() {

            const token = getMessageAuthToken();

            if (!token) {

                window.location.href = "login.html";

                return false;

            }

            return true;

        }


        /* =========================================
           LOAD MESSAGES
        ========================================= */

        async function loadMessages() {

            if (!checkMessagesLogin()) {
                return;
            }


            const token = getMessageAuthToken();


            const list = document.getElementById("messagesList");


            list.innerHTML = `
                <div class="empty-message">
                    <h3>Loading messages...</h3>
                    <p>Please wait.</p>
                </div>
            `;


            try {

                const response = await fetch(
                    "/api/messages",
                    {
                        method: "GET",

                        headers: {
                            "Authorization":
                                "Bearer " + token
                        }
                    }
                );


                const data = await response.json();


                if (!response.ok || !data.success) {

                    if (response.status === 401) {

                        alert(
                            "Session expired. Please login again."
                        );

                        logoutUser();

                        return;

                    }

                    throw new Error(
                        data.message ||
                        "Failed to load messages"
                    );

                }


                allMessages = data.messages || [];


                updateMessageStats();


                filterMessages();


            } catch (error) {

                console.error(
                    "Load messages error:",
                    error
                );


                list.innerHTML = `
                    <div class="empty-message">

                        <h3>
                            Unable to load messages
                        </h3>

                        <p>
                            ${escapeHtml(error.message)}
                        </p>

                    </div>
                `;

            }

        }


        /* =========================================
           UPDATE STATS
        ========================================= */

        function updateMessageStats() {

            const total =
                allMessages.length;


            document.getElementById(
                "totalMessages"
            ).textContent = total;


            const senders =
                new Set(
                    allMessages.map(
                        message =>
                            (message.email || "")
                                .toLowerCase()
                    )
                );


            document.getElementById(
                "uniqueSenders"
            ).textContent =
                senders.size;


            if (allMessages.length > 0) {

                const sorted =
                    [...allMessages].sort(
                        (a, b) =>
                            new Date(b.date) -
                            new Date(a.date)
                    );


                const latest =
                    sorted[0];


                document.getElementById(
                    "latestMessage"
                ).textContent =
                    formatDate(latest.date);

            } else {

                document.getElementById(
                    "latestMessage"
                ).textContent = "-";

            }

        }


        /* =========================================
           FILTER MESSAGES
        ========================================= */

        function filterMessages() {

            const search =
                document.getElementById(
                    "messageSearch"
                ).value
                    .toLowerCase()
                    .trim();


            const filter =
                document.getElementById(
                    "messageFilter"
                ).value;


            let filtered =
                allMessages.filter(
                    message => {

                        const text = (

                            (message.name || "") +
                            " " +
                            (message.email || "") +
                            " " +
                            (message.message || "")

                        ).toLowerCase();


                        const matchesSearch =
                            !search ||
                            text.includes(search);


                        let matchesFilter = true;


                        if (filter === "unread") {

                            matchesFilter =
                                message.read === false;

                        }


                        if (filter === "read") {

                            matchesFilter =
                                message.read === true;

                        }


                        return (
                            matchesSearch &&
                            matchesFilter
                        );

                    }
                );


            displayMessages(filtered);

        }


        /* =========================================
           DISPLAY MESSAGES
        ========================================= */

        function displayMessages(messages) {

            const list =
                document.getElementById(
                    "messagesList"
                );


            if (!messages.length) {

                list.innerHTML = `
                    <div class="empty-message">

                        <h3>
                            No messages found
                        </h3>

                        <p>
                            There are no messages matching your search.
                        </p>

                    </div>
                `;

                return;

            }


            list.innerHTML =
                messages.map(
                    message =>
                        createMessageCard(message)
                ).join("");

        }


        /* =========================================
           CREATE MESSAGE CARD
        ========================================= */

        function createMessageCard(message) {

            const id =
                message._id ||
                message.id;


            const unread =
                message.read === false;


            const date =
                formatDate(message.date);


            const preview =
                message.message || "";


            return `

                <div
                    class="message-card ${unread ? "unread" : ""}"
                    id="message-${escapeHtml(id)}">

                    <div class="message-top">

                        <div class="sender-info">

                            <h3>

                                ${escapeHtml(
                                    message.name ||
                                    "Unknown User"
                                )}

                                ${
                                    unread
                                        ? `<span class="unread-badge">
                                            New
                                           </span>`
                                        : ""
                                }

                            </h3>


                            <p>
                                ${escapeHtml(
                                    message.email ||
                                    "No email"
                                )}
                            </p>

                        </div>


                        <div class="message-date">

                            ${escapeHtml(date)}

                        </div>

                    </div>


                    <div class="message-preview">

                        ${escapeHtml(
                            preview.length > 180
                                ? preview.substring(0, 180) + "..."
                                : preview
                        )}

                    </div>


                    <div class="message-actions">

                        <button
                            class="message-action-btn"
                            onclick="viewMessage('${escapeHtml(id)}')">

                            👁️ View

                        </button>


                        <button
                            class="message-action-btn delete"
                            onclick="deleteMessage('${escapeHtml(id)}')">

                            🗑️ Delete

                        </button>

                    </div>

                </div>

            `;

        }


        /* =========================================
           VIEW MESSAGE
        ========================================= */

        async function viewMessage(id) {

            const message =
                allMessages.find(
                    item =>
                        String(
                            item._id || item.id
                        ) === String(id)
                );


            if (!message) {

                alert(
                    "Message not found."
                );

                return;

            }


            if (message.read === false) {

                await markMessageAsRead(id);

            }


            const content =
                document.getElementById(
                    "modalContent"
                );


            content.innerHTML = `

                <div class="detail-row">

                    <strong>
                        Name
                    </strong>

                    <span>
                        ${escapeHtml(
                            message.name ||
                            "-"
                        )}
                    </span>

                </div>


                <div class="detail-row">

                    <strong>
                        Email
                    </strong>

                    <span>
                        ${escapeHtml(
                            message.email ||
                            "-"
                        )}
                    </span>

                </div>


                <div class="detail-row">

                    <strong>
                        Date
                    </strong>

                    <span>
                        ${escapeHtml(
                            formatDate(message.date)
                        )}
                    </span>

                </div>


                <div class="detail-row">

                    <strong>
                        Message
                    </strong>

                    <div class="message-full">

                        ${escapeHtml(
                            message.message ||
                            ""
                        )}

                    </div>

                </div>

            `;


            document
                .getElementById("messageModal")
                .classList.add("show");

        }


        /* =========================================
           MARK MESSAGE AS READ
        ========================================= */

        async function markMessageAsRead(id) {

            const token =
                getMessageAuthToken();


            try {

                const response =
                    await fetch(
                        `/api/messages/${id}/read`,
                        {
                            method: "PUT",

                            headers: {
                                "Authorization":
                                    "Bearer " + token,

                                "Content-Type":
                                    "application/json"
                            }
                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    console.error(
                        "Mark read failed:",
                        data.message
                    );

                    return;

                }


                const message =
                    allMessages.find(
                        item =>
                            String(
                                item._id || item.id
                            ) === String(id)
                    );


                if (message) {

                    message.read = true;

                }


                updateMessageStats();


                filterMessages();


            } catch (error) {

                console.error(
                    "Mark read error:",
                    error
                );

            }

        }


        /* =========================================
           DELETE MESSAGE
        ========================================= */

        async function deleteMessage(id) {

            const confirmDelete =
                confirm(
                    "Are you sure you want to delete this message?"
                );


            if (!confirmDelete) {
                return;
            }


            const token =
                getMessageAuthToken();


            try {

                const response =
                    await fetch(
                        `/api/messages/${id}`,
                        {
                            method: "DELETE",

                            headers: {
                                "Authorization":
                                    "Bearer " + token
                            }
                        }
                    );


                const data =
                    await response.json();


                if (!response.ok || !data.success) {

                    if (response.status === 401) {

                        alert(
                            "Session expired. Please login again."
                        );

                        logoutUser();

                        return;

                    }

                    throw new Error(
                        data.message ||
                        "Delete failed"
                    );

                }


                allMessages =
                    allMessages.filter(
                        message =>
                            String(
                                message._id ||
                                message.id
                            ) !== String(id)
                    );


                updateMessageStats();

                filterMessages();


                alert(
                    "Message deleted successfully."
                );


            } catch (error) {

                console.error(
                    "Delete error:",
                    error
                );


                alert(
                    "Failed to delete message: " +
                    error.message
                );

            }

        }


        /* =========================================
           CLOSE MODAL
        ========================================= */

        function closeMessageModal() {

            document
                .getElementById("messageModal")
                .classList.remove("show");

        }


        function closeModalOutside(event) {

            if (
                event.target.id ===
                "messageModal"
            ) {

                closeMessageModal();

            }

        }


        /* =========================================
           DATE FORMAT
        ========================================= */

        function formatDate(date) {

            if (!date) {
                return "-";
            }


            const d =
                new Date(date);


            if (isNaN(d.getTime())) {
                return "-";
            }


            return d.toLocaleString(
                "en-IN",
                {
                    day: "2-digit",
                    month: "short",
                    year: "numeric",
                    hour: "2-digit",
                    minute: "2-digit"
                }
            );

        }


        /* =========================================
           ESCAPE HTML
        ========================================= */

        function escapeHtml(value) {

            if (value === null ||
                value === undefined) {

                return "";

            }


            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        /* =========================================
           PAGE LOAD
        ========================================= */

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                if (!checkMessagesLogin()) {
                    return;
                }


                loadMessages();

            }
        );

    </script>

</body>

</html>
